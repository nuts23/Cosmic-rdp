<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#385466" />
      <stop offset="100%" stop-color="#1b2832" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e8cba" />
      <stop offset="100%" stop-color="#1f5882" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64c8ff" />
      <stop offset="100%" stop-color="#0080ff" />
    </linearGradient>
  </defs>

  <!-- Monitor Body -->
  <rect x="14" y="16" width="100" height="74" rx="10" ry="10" fill="url(#bgGrad)" stroke="#4d6f85" stroke-width="2" />
  
  <!-- Monitor Screen -->
  <rect x="20" y="22" width="88" height="60" rx="6" ry="6" fill="url(#screenGrad)" />

  <!-- Remote Connection Waves / Grid Motif -->
  <path d="M32 40 Q64 26 96 40" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M40 50 Q64 40 88 50" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <path d="M48 60 Q64 54 80 60" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" opacity="1.0" />

  <!-- Center Connection Dot -->
  <circle cx="64" cy="68" r="4" fill="#ffffff" />

  <!-- Stand Base -->
  <path d="M54 90 L50 108 L78 108 L74 90 Z" fill="#2d4251" />
  <rect x="42" y="106" width="44" height="6" rx="3" ry="3" fill="#4d6f85" />
</svg>
